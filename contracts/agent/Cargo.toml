[package]
name = "agent-exit"
description = "Agent Exit contract: deed (NEP-171, one token), earnings meter, listing, one-step buy() handover, earn-out escrow."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible build (NEP-330): `make build` runs this image by digest.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:b193c8640a27172f83136a0f0aab2a9bf9d09f6ba0e6afd187addfaa9b92bae0"
# The token, admin and MPC accounts are compiled in (A26). They must reach
# the container, or the published wasm bakes in the offline defaults.
passed_env = ["AGENT_EXIT_TOKEN", "AGENT_EXIT_ADMIN", "AGENT_EXIT_MPC", "AGENT_EXIT_MIN_WINDOW_SECS"]
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[features]
# In-process simulator (mocked NEAR runtime) used by unit tests and tools/verify.
sim = ["near-sdk/unit-testing", "dep:base-wallet"]

[dependencies]
# `unstable` exposes env::ecrecover (NEAR Verified badge).
near-sdk = { workspace = true, features = ["unstable"] }
agent-core = { path = "../agent-core" }
near-contract-standards.workspace = true
serde_json.workspace = true
# Offline TEST MPC signer for the simulator (feature 5); not in the wasm.
base-wallet = { path = "../../tools/base-wallet", optional = true }

[dev-dependencies]
proptest = "1"
base-wallet = { path = "../../tools/base-wallet" }
near-sdk = { workspace = true, features = ["unit-testing", "unstable"] }

[package]
name = "agent-core"
description = "Pure state machine for Agent Exit: meter, listing, buy/handover, earn-out escrow. No near-sdk env."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
borsh.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

# Schema derives for the contract ABI (`cargo near build` generates it from a
# native build). Not compiled into the wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
borsh = { workspace = true, features = ["unstable__schema"] }
schemars = "0.8.22"

[dev-dependencies]
proptest = "1"

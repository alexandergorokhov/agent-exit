name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fetch crates (the only networked step)
        run: cargo fetch --locked
      - name: make verify (offline; unit + property tests + fixed world vs golden)
        run: make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-json
          path: out/verify.json

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: contracts type-check for wasm32
        run: cargo check --locked --target wasm32-unknown-unknown -p agent-exit -p xusd

  near-build:
    # The default cargo-near build (ABI generated from a native build): every
    # type in a public method or the contract state needs JsonSchema or
    # BorshSchema, which a plain wasm type-check does not catch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: system libs for cargo-near (libudev via hidapi)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-near@0.22.0
      - name: cargo near build (agent, with ABI)
        working-directory: contracts/agent
        run: cargo near build non-reproducible-wasm
      - name: cargo near build (xusd, with ABI)
        working-directory: contracts/xusd
        run: cargo near build non-reproducible-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm-abi
          path: target/near/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - name: cargo audit + ignored advisories stay out of the wasm
        run: make audit

  sandbox:
    # Real local node (near-sandbox). Not yet confirmed green on Actions, so it
    # does not block the other jobs until its first green run.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: system libs for cargo-near (libudev via hidapi)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-near@0.22.0
      - name: make test-sandbox
        run: |
          ulimit -n 65535 || true
          make test-sandbox
